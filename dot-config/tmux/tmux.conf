# Use Ctrl-a as prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Remove Esc key delay
set -sg escape-time 0

# Focus events (for vim autoread, etc.)
set -g focus-events on

# True color support
set -as terminal-features "xterm-256color:RGB"

# Extended keys
set -as terminal-features "xterm-256color:extkeys"
set -g extended-keys on

# Set default-terminal so tmux itself knows what it's emulating
set -g default-terminal "tmux-256color"

# Enable mouse support for resizing and selection
set -g mouse on

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Easy config reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded."

# More intuitive split
unbind '"'
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane management
bind z resize-pane -Z
bind '!' break-pane
bind '@' join-pane -t '!'
bind Space next-layout
bind e set-window-option synchronize-panes

# Window management
bind c new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1
bind x kill-pane
bind X kill-window

# Session management
bind s choose-tree -Zs
bind R command-prompt -I "#S" "rename-session '%%'"
bind S command-prompt -p "Session name:" "new-session -s '%%' -c '#{pane_current_path}'"
bind C-f display-popup -E "$HOME/.local/bin/tmux-sessionizer"

# Copy mode
bind [ copy-mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind p paste-buffer

# Popups
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# Restart pane command
bind R respawn-pane -k

# Misc quality of life
set -g set-titles on
set -g set-titles-string "#T"
setw -g automatic-rename on
set -g history-limit 10000
set -g display-time 2000
set -g allow-passthrough on
bind t set -g status

# Status bar
set -g status-style "bg=default,fg=colour8"
set -g status-interval 1
set -g status-left-length 25
set -g status-right-length 25
set -g status-justify centre
set -g status-left "#[fg=#{?client_prefix,colour196,colour3},bold] #H #[fg=colour8,nobold]│ #[fg=colour211,bold]#S "
set -g status-right " #[fg=colour211,bold]%H:%M #[fg=colour8,nobold]│ #[fg=colour3,bold]%b %d "

# Window Status
setw -g window-status-current-style "fg=colour6,bold"
setw -g window-status-current-format "#I:#W#{?window_zoomed_flag,#[fg=colour3] 󰊓,}#{?window_bell_flag,#[fg=colour5] ◉,}"
setw -g window-status-style "fg=colour8"
setw -g window-status-format "#I:#W#{?window_zoomed_flag,#[fg=colour3] 󰊓,}#{?window_bell_flag,#[fg=colour5] ◉,}"
setw -g window-status-separator " #[fg=colour8,nobold]│ "

# Styling
set -g pane-border-style "fg=default"
set -g pane-active-border-style "fg=colour4"
set -g message-style "bg=default,fg=colour4"

# Plugins
# tmux-resurrect
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'vi vim nvim emacs lazygit opencode'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @continuum-boot 'on'

# Plugins
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
